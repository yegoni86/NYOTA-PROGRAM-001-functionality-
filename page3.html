<!DOCTYPE html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title> Select Amount</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',Arial,sans-serif;
}

body{
background:linear-gradient(135deg,#0B7A2F,#2563EB);
padding:6px;
}

.container{
width:100%;
max-width:380px;
margin:auto;
background:#fff;
border-radius:15px;
overflow:hidden;
box-shadow:0 10px 24px rgba(0,0,0,.2);
}

.header{
background:linear-gradient(135deg,#0B7A2F,#2563EB);
color:#fff;
text-align:center;
padding:16px 14px;
}

.header h2{
font-size:20px;
margin-bottom:4px;
}

.header p{
font-size:13px;
line-height:1.35;
}

.content{
padding:14px;
}

.section-title{
font-size:16px;
font-weight:700;
color:#0B7A2F;
margin-bottom:10px;
text-align:center;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:8px;
}

.option{
position:relative;
height:78px;
display:flex;
align-items:center;
justify-content:center;
border:2px solid #E5E7EB;
border-radius:12px;
cursor:pointer;
transition:.2s;
background:#fff;
}

.option:hover{
border-color:#16A34A;
background:#F8FFFA;
}

.option input{
display:none;
}

.amount{
font-size:19px;
font-weight:800;
color:#111827;
text-align:center;
}

.checkmark{
position:absolute;
top:6px;
right:6px;
width:20px;
height:20px;
border:2px solid #C7C7C7;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
background:#fff;
transition:.2s;
}

.option.active{
border-color:#16A34A;
background:#F8FFFA;
}

.option.active .checkmark{
background:#16A34A;
border-color:#16A34A;
}

.option.active .checkmark::after{
content:"✓";
color:#fff;
font-size:13px;
font-weight:bold;
}

.option.last{
grid-column:1/2;
}

.summary{
margin-top:12px;
padding:12px;
background:#F9FAFB;
border-radius:10px;
}

.summary p{
font-size:13px;
}

button{
width:100%;
padding:13px;
margin-top:14px;
border:none;
border-radius:10px;
background:linear-gradient(135deg,#16A34A,#0B7A2F);
color:#fff;
font-size:16px;
font-weight:bold;
cursor:pointer;
}

button:disabled{
opacity:.6;
cursor:not-allowed;
}

.footer{
text-align:center;
padding:12px;
color:#666;
font-size:11px;
}
</style>
</head>

<body>

<div class="container">

<div class="header">

<h2>🇰🇪🇰🇪Congratulations 🎉</h2>

<p><strong id="applicantName">Kipngetich Isaac</strong></p>

<p>
You're eligible for NYOTA Funds Limits.
Kindly choose the amount you want to apply then you continue with application.
</p>
</div>

<div class="content">

<div class="section-title">Choose an Amount</div>

<div class="grid">

<label class="option">
<input type="radio" name="amount" value="22000">
<span class="amount">Ksh 22,000</span>
<span class="checkmark"></span>
</label>

<label class="option">
<input type="radio" name="amount" value="30000">
<span class="amount">Ksh 30,000</span>
<span class="checkmark"></span>
</label>

<label class="option">
<input type="radio" name="amount" value="40000">
<span class="amount">Ksh 40,000</span>
<span class="checkmark"></span>
</label>

<label class="option">
<input type="radio" name="amount" value="50000">
<span class="amount">Ksh 50,000</span>
<span class="checkmark"></span>
</label>

<label class="option">
<input type="radio" name="amount" value="65000">
<span class="amount">Ksh 65,000</span>
<span class="checkmark"></span>
</label>

<label class="option">
<input type="radio" name="amount" value="75000">
<span class="amount">Ksh 75,000</span>
<span class="checkmark"></span>
</label>

<label class="option">
<input type="radio" name="amount" value="85000">
<span class="amount">Ksh 85,000</span>
<span class="checkmark"></span>
</label>

<label class="option">
<input type="radio" name="amount" value="110000">
<span class="amount">Ksh 110,000</span>
<span class="checkmark"></span>
</label>

<label class="option last">
<input type="radio" name="amount" value="150000">
<span class="amount">Ksh 150,000</span>
<span class="checkmark"></span>
</label>

</div>

<div class="summary">
<p><strong>Selected Amount:</strong> <span id="selected">Ksh ---</span></p>
</div>

<button id="continueBtn" type="button" disabled>Continue →</button>

</div>

<div class="footer">🇰🇪🇰🇪NYOTA Funds Application🇰🇪🇰🇪</div>

</div>

<script>
const radios = document.querySelectorAll('input[name="amount"]');
const selected = document.getElementById("selected");
const button = document.getElementById("continueBtn");

let chosenAmount = "";

radios.forEach(radio=>{
  radio.addEventListener("change",function(){

    document.querySelectorAll(".option").forEach(card=>{
      card.classList.remove("active");
    });

    this.closest(".option").classList.add("active");

    chosenAmount = this.value;
    selected.textContent = "Ksh " + Number(chosenAmount).toLocaleString();

    localStorage.setItem("selectedAmount", chosenAmount);

    button.disabled = false;
  });
});

button.addEventListener("click",function(){
  if(!chosenAmount){
    alert("Please select an amount.");
    return;
  }

  window.location.href = "payment.html";
});
</script>

</body>
</html>
